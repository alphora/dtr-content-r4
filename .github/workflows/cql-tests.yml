name: CQL Automated Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'input/cql/**'
      - 'input/tests/**'
      - 'input/l2/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'input/cql/**'
      - 'input/tests/**'
      - 'input/l2/**'

jobs:
  test-cql:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache CQF Tooling
      uses: actions/cache@v4
      with:
        path: input-cache/
        key: ${{ runner.os }}-cqf-tooling-3.10.0

    - name: Download CQF Tooling
      run: |
        mkdir -p input-cache
        if [ ! -f input-cache/tooling-cli-3.10.0.jar ]; then
          curl -L -o input-cache/tooling-cli-3.10.0.jar \
            https://repo1.maven.org/maven2/org/opencds/cqf/tooling-cli/3.10.0/tooling-cli-3.10.0.jar
        fi

    - name: Run CQL Tests
      run: ./test-cql.sh

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cql-test-results
        path: output/test-results/
        retention-days: 30

    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const log = fs.readFileSync('output/test-results/test-run.log', 'utf8');
          const lines = log.split('\n');
          const last50 = lines.slice(-50).join('\n');
          const body = `## CQL Test Results\n\n\`\`\`\n${last50}\n\`\`\``;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
